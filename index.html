ia}.mast{display:flex;justify-content:space-between;align-items:end;font:10px Georgia;letter-spacing:1px}.mast b{font-size:31px;letter-spacing:-1.8px}.rule{border-top:3px solid;border-bottom:1px solid;height:5px;margin:10px 0 18px}.kicker{font:bold 11px Arial;color:var(--red);letter-spacing:1.2px}.paper h1{font:clamp(38px,5vw,64px)/1 Georgia,serif;letter-spacing:-2.6px;margin:14px 0}.deck{font:18px/1.42 Georgia;max-width:720px}.by{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;font-size:11px;color:#615c54}.hero{width:min(100%,310px);aspect-ratio:3/4;margin:25px auto;background:#dfdbd0;border:1px solid #aaa394;display:grid;place-items:center;text-align:center;overflow:hidden;cursor:pointer}.hero img{width:100%;height:100%;object-fit:cover}.hero b{font:16px Georgia}.cols{columns:3 200px;column-gap:34px;column-rule:1px solid #d0cabd;font:16px/1.65 Georgia;text-align:justify}.cols p{break-inside:avoid;margin-top:0}.edit{outline:0;cursor:text;border:1px dashed transparent}.edit:focus{border-color:#b54a37;background:#fffdf7}.story{position:relative;width:min(700px,calc(100% - 40px));margin:40px auto;padding:28px;background:var(--paper);display:grid;grid-template-columns:3fr 4fr;gap:25px;box-shadow:0 8px 26px #7777}.story .hero{width:100%;margin:0}.story h1{font:38px/1 Georgia;margin:10px 0 18px}.story p{font:16px/1.65 Georgia}.map{position:relative;min-height:calc(100vh - 116px);padding:0;background:#f8f8f5;overflow:auto}.mind-svg{display:block;width:1400px;height:760px;background:radial-gradient(#d1cec6 1px,transparent 1px);background-size:18px 18px}.mind-svg path{fill:none;stroke:#575953;stroke-width:2.2;stroke-linecap:round}.mind-svg .secondary{stroke:#91928b;stroke-width:1.4}.mind-svg text{fill:#262724;font:16px "PingFang SC",Arial}.mind-svg .root-label{fill:#fff;font:bold 22px "PingFang SC",Arial}.mind-svg .branch-label{font:bold 18px "PingFang SC",Arial}.mind-svg rect{fill:#262824}.mind-svg .root-circle{fill:#b54a37}.relation .mind-svg .root-circle{fill:#20221f}.split .mind-svg .right-only{display:none}@media(max-width:760px){.nav{padding:0 13px;gap:10px}.brand{display:none}.tabs button{padding:0 9px;font-size:13px}.tool{grid-template-columns:1fr}.panel{padding:18px}.work{overflow:visible}.bar{padding:0 15px}.paper{width:calc(100% - 24px);margin:14px auto;padding:20px}.mast b{font-size:20px}.mast{font-size:8px}.paper h1{font-size:41px}.cols{columns:1}.story{grid-template-columns:1fr;padding:20px;margin:18px auto}.story .hero{max-width:300px;margin:auto}.map{padding:0;overflow:auto}.bar button{font-size:12px;padding:8px}.label textarea{height:130px}}@media print{.nav,.panel,.bar{display:none}.tool{display:block}.paper,.story{box-shadow:none;width:100%;margin:0}.map{min-height:auto}}

<body><nav class="nav"><span class="mark">N</span><span class="brand">Newsroom Studio</span><div class="tabs"><button data-tab="news" class="on">新闻排版</button><button data-tab="write">写文章</button></div></nav><main id="app"></main>
<script>
const state={tab:'news',name:'THE FINANCIAL JOURNAL',edition:'晨间版',title:'市场在不确定性中寻找新的定价锚点',article:'市场在不确定性中寻找新的定价锚点\n\n投资者正在重新评估增长、通胀与利率之间的微妙平衡。过去数周，风险资产的波动并未削弱企业扩张的意愿，反而让管理层更强调现金流与执行效率。\n\n在上海、纽约与伦敦，交易员把目光投向即将公布的宏观数据。对长期投资者而言，真正重要的并不是某一个数字，而是数据背后趋势是否会改变。\n\n“当预期变得拥挤，耐心本身就是一种优势。”一位资深基金经理表示。',cols:3,image:'',writerTitle:'一篇值得被好好阅读的文章',writerText:'把文章粘贴到左侧，便会自动排成一张干净的竖版文章卡。',writerImage:'',markdown:'# 品牌增长计划\n## 内容策略\n- 深度报道\n- 每周通讯\n## 产品体验\n- 编辑器优化\n- 移动端使用',style:'normal'};
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function panel(content){return `<aside class="panel">${content}</aside>`}function bar(title,id){return `<header class="bar"><span>${title}</span><button onclick="window.print()">保存 PDF</button><button onclick="downloadLong('${id}')">下载长图</button></header>`}function downloadLong(id){let n=document.getElementById(id),s=document.querySelector('style').textContent,w=n.scrollWidth,h=n.scrollHeight,svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${s}</style>${n.outerHTML}</div></foreignObject></svg>`,img=new Image,blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);img.onload=()=>{let c=document.createElement('canvas');c.width=w*2;c.height=h*2;let x=c.getContext('2d');x.scale(2,2);x.fillStyle='#f7f3e9';x.fillRect(0,0,w,h);x.drawImage(img,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='无墙之门-长图.png';a.click();URL.revokeObjectURL(a.href)},'image/png');URL.revokeObjectURL(url)};img.src=url}
function news(){let ps=state.article.split(/\n\s*\n/).filter(Boolean).map(p=>`<p class="edit" contenteditable="true">${esc(p)}</p>`).join('');return `<div class="tool">${panel(`<b>新闻编辑台</b><label class="label">报纸名称<input data-k="name" value="${esc(state.name)}"></label><label class="label">版次<select data-k="edition"><option ${state.edition==='晨间版'?'selected':''}>晨间版</option><option ${state.edition==='午间版'?'selected':''}>午间版</option><option ${state.edition==='周末版'?'selected':''}>周末版</select></label><label class="label">主标题<input data-k="title" value="${esc(state.title)}"></label><label class="label">文章内容<textarea data-k="article">${esc(state.article)}</textarea></label><div class="label">栏数<div class="buttons">${[2,3,4].map(n=>`<button data-cols="${n}" class="${state.cols===n?'on':''}">${n}栏</button>`).join('')}</div></div><p class="note">预览上的标题、正文、作者信息都可直接点击修改。</p>`)}<section class="work">${bar('新闻排版预览','news-card')}<article id="news-card" class="paper"><span class="water">无墙之门</span><div class="mast"><span class="edit" contenteditable="true">EST. 2026</span><b class="edit" contenteditable="true">${esc(state.name)}</b><span class="edit" contenteditable="true">${esc(state.edition)} · 亚洲</span></div><div class="rule"></div><div class="kicker edit" contenteditable="true">商业与市场 / 深度报道</div><h1 class="edit" contenteditable="true">${esc(state.title)}</h1><p class="deck edit" contenteditable="true">用清晰、克制的报纸版式，让每一段重要叙述都有呼吸的空间。</p><div class="by edit" contenteditable="true">记者：编辑部　2026 年 8 月 11 日　阅读 4 分钟</div>${file('image')}<div class="cols" style="columns:${state.cols} 200px">${ps}</div></article></section></div>`}
function write(){return `<div class="tool">${panel(`<b>写文章</b><label class="label">标题<input data-k="writerTitle" value="${esc(state.writerTitle)}"></label><label class="label">文章<textarea data-k="writerText">${esc(state.writerText)}</textarea></label><p class="note">预览文字可直接点改，也可以粘贴文章。</p>`)}<section class="work">${bar('3:4 文章版','story-card')}<article id="story-card" class="story"><span class="water">无墙之门</span>${file('writerImage')}<div><small class="edit" contenteditable="true" style="color:#b54a37;letter-spacing:1px">STORY / NOTES</small><h1 class="edit" contenteditable="true">${esc(state.writerTitle)}</h1><div class="edit" contenteditable="true">${state.writerText.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div></div></article></section></div>`}
function mapData(){let root='思维导图',a=[];let current;state.markdown.split('\n').forEach(x=>{x=x.trim();if(/^#\s/.test(x))root=x.slice(2);else if(/^##\s/.test(x)){current={t:x.slice(3),i:[]};a.push(current)}else if(/^-\s/.test(x)){if(!current){current={t:'要点',i:[]};a.push(current)}current.i.push(x.slice(2))}});return{root,a:a.length?a:[{t:'开始',i:['输入 Markdown']}]} }
function map(){let m=mapData(),nodes=m.a.map((b,i)=>{let side=state.style==='normal'?1:(i%2?1:-1),y=130+i*170,x=700+side*270,anchor=side>0?'start':'end',kids=b.i.map((v,j)=>{let ky=y+40+j*33,kx=700+side*500;return `<path class="secondary" d="M ${x+side*12} ${y+5} C ${x+side*90} ${y+5},${kx-side*80} ${ky},${kx} ${ky}"/><text x="${kx+side*10}" y="${ky+5}" text-anchor="${anchor}">${esc(v)}</text>`}).join('');return `<path d="M 700 380 C ${700+side*100} 380,${x-side*100} ${y},${x} ${y}"/><text class="branch-label" x="${x+side*10}" y="${y+5}" text-anchor="${anchor}">${esc(b.t)}</text>${kids}`}).join('');return `<div class="tool">${panel(`<b>Markdown 思维导图</b><label class="label">Markdown<textarea data-k="markdown">${esc(state.markdown)}</textarea></label><div class="label">布局方式<div class="buttons">${[['normal','右向'],['relation','人物关系'],['split','左右']].map(([k,n])=>`<button data-style="${k}" class="${state.style===k?'on':''}">${n}</button>`).join('')}</div></div><p class="note"># 中心主题；## 一级分支；- 为子节点。导图是可横向浏览的真实分支结构。</p>`)}<section class="work">${bar('思维导图','mind-map')}<div id="mind-map" class="map ${state.style}"><svg class="mind-svg" viewBox="0 0 1400 760"><circle class="root-circle" cx="700" cy="380" r="42"/><text class="root-label" x="700" y="387" text-anchor="middle">${esc(m.root)}</text>${nodes}</svg><span class="water">无墙之门</span></div></section></div>`}
function bind(){document.querySelectorAll('[data-k]').forEach(e=>{e.oninput=()=>{state[e.dataset.k]=e.value};e.onchange=()=>render()});document.querySelectorAll('[data-cols]').forEach(e=>e.onclick=()=>{state.cols=+e.dataset.cols;render()});document.querySelectorAll('[data-style]').forEach(e=>e.onclick=()=>{state.style=e.dataset.style;render()});['image','writerImage'].forEach(k=>{let p=document.getElementById(k+'Pick'),f=document.getElementById(k+'File');if(p){p.onclick=()=>f.click();f.onchange=()=>{let r=new FileReader();r.onload=()=>{state[k]=r.result;render()};if(f.files[0])r.readAsDataURL(f.files[0])}}})}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));app.innerHTML=state.tab==='news'?news():state.tab==='write'?write():map();bind()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();
/* iPhone Safari 不支持上一版 foreignObject 截图；这里直接用 Canvas 绘制并调用系统分享。 */
function drawLines(c,t,x,y,max,lh){let s=String(t||'').replace(/\s+/g,' ').trim(),line='';for(let ch of s){if(c.measureText(line+ch).width>max&&line){c.fillText(line,x,y);y+=lh;line=ch}else line+=ch}if(line){c.fillText(line,x,y);y+=lh}return y}
function canvasBlob(c){let b=atob(c.toDataURL('image/png').split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'image/png'})}
function downloadLong(id){let n=document.getElementById(id),title=(n.querySelector('h1')||n.querySelector('.root-label')||{}).textContent||'无墙之门',raw=n.innerText||title,c=document.createElement('canvas'),w=1080;c.width=w;c.height=Math.max(1600,760+Math.ceil(raw.length/22)*42);let x=c.getContext('2d'),y=84;x.fillStyle='#f7f3e9';x.fillRect(0,0,c.width,c.height);x.fillStyle='#b54a37';x.fillRect(60,58,9,80);x.fillStyle='#20221f';x.font='bold 22px Georgia';x.fillText('无墙之门  /  NEWSROOM STUDIO',92,86);x.strokeStyle='#20221f';x.lineWidth=3;x.beginPath();x.moveTo(60,150);x.lineTo(1020,150);x.stroke();x.fillStyle='#171815';x.font='bold 52px Georgia';y=drawLines(x,title,60,225,960,66)+38;x.strokeStyle='#b7b0a1';x.lineWidth=1;x.beginPath();x.moveTo(60,y);x.lineTo(1020,y);x.stroke();y+=50;x.font='30px Georgia';y=drawLines(x,raw.replace(title,''),60,y,960,46);x.fillStyle='rgba(20,20,20,.36)';x.font='bold 26px Georgia';x.fillText('无墙之门',800,c.height-48);let blob=canvasBlob(c),file=new File([blob],'无墙之门-长图.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'无墙之门长图'}).catch(()=>{})}else{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
/* 新闻版：开篇、中段、结尾前的三张竖图均可单独上传。 */
function file(key,label='主图'){return `<input id="${key}File" type="file" accept="image/*" hidden><div class="hero" id="${key}Pick">${state[key]?`<img src="${state[key]}">`:`<div><b>点击上传 3:4 ${label}</b><br><small>图片只保存在当前设备</small></div>`}</div>`}
function news(){let p=state.article.split(/\n\s*\n/).filter(Boolean).map(t=>`<p class="edit" contenteditable="true">${esc(t)}</p>`),cut=Math.ceil(p.length/3),body=p.slice(0,cut).join('')+file('imageMid','中段配图')+p.slice(cut,cut*2).join('')+file('imageEnd','结尾前配图')+p.slice(cut*2).join('');return `<div class="tool">${panel(`<b>新闻编辑台</b><label class="label">报纸名称<input data-k="name" value="${esc(state.name)}"></label><label class="label">版次<select data-k="edition"><option ${state.edition==='晨间版'?'selected':''}>晨间版</option><option ${state.edition==='午间版'?'selected':''}>午间版</option><option ${state.edition==='周末版'?'selected':''}>周末版</select></label><label class="label">主标题<input data-k="title" value="${esc(state.title)}"></label><label class="label">文章内容<textarea data-k="article">${esc(state.article)}</textarea></label><div class="label">栏数<div class="buttons">${[2,3,4].map(n=>`<button data-cols="${n}" class="${state.cols===n?'on':''}">${n}栏</button>`).join('')}</div></div><p class="note">预览文字可直接点改。开篇、中段、结尾前各有一个 3:4 图片位。</p>`) }<section class="work">${bar('新闻排版预览','news-card')}<article id="news-card" class="paper"><span class="water">无墙之门</span><div class="mast"><span class="edit" contenteditable="true">EST. 2026</span><b class="edit" contenteditable="true">${esc(state.name)}</b><span class="edit" contenteditable="true">${esc(state.edition)} · 亚洲</span></div><div class="rule"></div><div class="kicker edit" contenteditable="true">商业与市场 / 深度报道</div><h1 class="edit" contenteditable="true">${esc(state.title)}</h1><p class="deck edit" contenteditable="true">用清晰、克制的报纸版式，让每一段重要叙述都有呼吸的空间。</p><div class="by edit" contenteditable="true">记者：编辑部　2026 年 8 月 11 日　阅读 4 分钟</div>${file('image','开篇主图')}<div class="cols" style="columns:${state.cols} 200px">${body}</div></article></section></div>`}
function bind(){document.querySelectorAll('[data-k]').forEach(e=>{e.oninput=()=>{state[e.dataset.k]=e.value};e.onchange=()=>render()});document.querySelectorAll('[data-cols]').forEach(e=>e.onclick=()=>{state.cols=+e.dataset.cols;render()});document.querySelectorAll('[data-style]').forEach(e=>e.onclick=()=>{state.style=e.dataset.style;render()});['image','imageMid','imageEnd','writerImage'].forEach(k=>{let p=document.getElementById(k+'Pick'),f=document.getElementById(k+'File');if(p){p.onclick=()=>f.click();f.onchange=()=>{let r=new FileReader();r.onload=()=>{state[k]=r.result;render()};if(f.files[0])r.readAsDataURL(f.files[0])}}})}
/* 真正按 Markdown 层级生成的分支图：标题、项目符号和编号都会成为节点。 */
function mindTree(text){let root={t:'中心主题',c:[]},stack=[root];String(text||'').split('\n').forEach(row=>{let h=row.match(/^(#{1,6})\s+(.+)/),b=row.match(/^(\s*)[-*+]\s+(.+)/),num=row.match(/^(\s*)\d+[.、]\s+(.+)/),plain=row.trim();let d=0,t='';if(h){d=h[1].length;t=h[2]}else if(b){d=2+Math.floor(b[1].length/2);t=b[2]}else if(num){d=2+Math.floor(num[1].length/2);t=num[2]}else if(plain){d=1;t=plain}else return;if(d===1){if(root.t==='中心主题')root.t=t;else root.c.push({t,c:[]});stack=[root]}else{while(stack.length>d)stack.pop();let parent=stack[stack.length-1]||root,node={t,c:[]};parent.c.push(node);stack[d]=node;stack.length=d+1}});return root}
function svgLabel(t,x,y,anchor,kind=''){let a=[],s=String(t),n=kind==='branch'?12:16;for(let i=0;i<s.length;i+=n)a.push(s.slice(i,i+n));return `<text class="${kind}" x="${x}" y="${y}" text-anchor="${anchor}">${a.map((v,i)=>`<tspan x="${x}" dy="${i?'1.25em':'0'}">${esc(v)}</tspan>`).join('')}</text>`}
function map(){let tree=mindTree(state.markdown),split=state.style!=='normal',cx=split?760:255,children=tree.c.length?tree.c:[{t:'输入 Markdown',c:[]}],out=[];let draw=(node,x,y,side,level)=>{let gap=Math.max(42,105-level*15),count=node.c.length;node.c.forEach((kid,i)=>{let ky=y+(i-(count-1)/2)*gap,kx=x+side*(level===0?300:235),sx=x+side*(level?12:42),ex=kx-side*12;out.push(`<path class="${level?'secondary':''}" d="M ${sx} ${y} C ${x+side*95} ${y}, ${kx-side*100} ${ky}, ${ex} ${ky}"/>`);out.push(svgLabel(kid.t,kx+side*12,ky+5,side>0?'start':'end',level===0?'branch':''));draw(kid,kx,ky,side,level+1)})};children.forEach((n,i)=>{let side=split?(i%2?1:-1):1,y=120+i*(610/Math.max(children.length-1,1));let x=cx+side*300;out.push(`<path d="M ${cx+side*42} 390 C ${cx+side*120} 390, ${x-side*110} ${y}, ${x-side*12} ${y}"/>`);out.push(svgLabel(n.t,x,y+5,side>0?'start':'end','branch'));draw(n,x,y,side,1)});return `<div class="tool">${panel(`<b>Markdown 思维导图</b><label class="label">Markdown<textarea data-k="markdown">${esc(state.markdown)}</textarea></label><button class="buttons" style="color:#fff;background:#79533c;border:0;padding:11px" onclick="render()">生成导图</button><div class="label">布局方式<div class="buttons">${[['normal','右向'],['relation','人物关系'],['split','左右']].map(([k,n])=>`<button data-style="${k}" class="${state.style===k?'on':''}">${n}</button>`).join('')}</div></div><p class="note">支持 # 中心主题、## 主分支、### 子分支；也支持缩进的 - 项目和编号。粘贴后点“生成导图”。</p>`)}<section class="work">${bar('思维导图','mind-map')}<div id="mind-map" class="map ${state.style}"><svg class="mind-svg" viewBox="0 0 1520 780"><circle class="root-circle" cx="${cx}" cy="390" r="48"/>${svgLabel(tree.t,cx,398,'middle','root-label')}${out.join('')}</svg><span class="water">无墙之门</span></div></section></div>`}
</script></body></html>
