<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>无墙之门 · Newsroom Studio</title>
  <style>
    :root{--ink:#181917;--paper:#f7f3e9;--dark:#20221f;--line:#b7b0a1;--red:#b54a37}*{box-sizing:border-box}body{margin:0;background:#dedcd5;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif}.nav{height:58px;background:var(--dark);color:#f7f3e9;display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;z-index:5}.mark{border:1px solid #e9e2d0;font:22px Georgia;padding:1px 7px}.brand{font:15px Georgia;white-space:nowrap}.tabs{display:flex;height:100%;gap:4px}.tabs button{color:#bbb7ae;background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;font-size:14px}.tabs button.on{color:#fff;border-color:#d5b96f}.tool{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 58px)}.panel{background:var(--dark);padding:22px;color:#eee8dc;display:flex;gap:15px;flex-direction:column}.label{font-size:11px;letter-spacing:1.3px;color:#c0baae;display:grid;gap:7px}.label input,.label textarea,.label select{font:14px Arial;background:#2d2f2c;border:1px solid #555850;color:#fff;padding:10px;width:100%}.label textarea{height:170px;resize:vertical}.note{font-size:12px;line-height:1.6;color:#aaa499}.buttons{display:flex;border:1px solid #555850}.buttons button{flex:1;border:0;border-right:1px solid #555850;background:transparent;color:#ddd6c8;padding:9px}.buttons button:last-child{border:0}.buttons button.on{background:#dfd6c4;color:#20221f;font-weight:bold}.work{overflow:auto}.bar{height:58px;background:#e7e4da;border-bottom:1px solid #c4c0b7;display:flex;align-items:center;padding:0 30px;gap:10px;font-size:13px;font-weight:bold}.bar button{margin-left:auto;border:0;padding:9px 12px;background:#272925;color:#fff;font-size:13px}.bar button+button{margin-left:0;background:#79533c}.paper{position:relative;width:min(980px,calc(100% - 64px));margin:38px auto;background:var(--paper);padding:34px 46px;box-shadow:0 8px 26px #7777}.water{position:absolute;right:20px;bottom:13px;color:#111;opacity:.18;letter-spacing:3px;font:bold 12px Georgia}.mast{display:flex;justify-content:space-between;align-items:end;font:10px Georgia;letter-spacing:1px}.mast b{font-size:31px;letter-spacing:-1.8px}.rule{border-top:3px solid;border-bottom:1px solid;height:5px;margin:10px 0 18px}.kicker{font:bold 11px Arial;color:var(--red);letter-spacing:1.2px}.paper h1{font:clamp(38px,5vw,64px)/1 Georgia,serif;letter-spacing:-2.6px;margin:14px 0}.deck{font:18px/1.42 Georgia;max-width:720px}.by{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;font-size:11px;color:#615c54}.hero{width:min(100%,310px);aspect-ratio:3/4;margin:25px auto;background:#dfdbd0;border:1px solid #aaa394;display:grid;place-items:center;text-align:center;overflow:hidden;cursor:pointer}.hero img{width:100%;height:100%;object-fit:cover}.hero b{font:16px Georgia}.cols{columns:3 200px;column-gap:34px;column-rule:1px solid #d0cabd;font:16px/1.65 Georgia;text-align:justify}.cols p{break-inside:avoid;margin-top:0}.edit{outline:0}.story{position:relative;width:min(700px,calc(100% - 40px));margin:40px auto;padding:28px;background:var(--paper);display:grid;grid-template-columns:3fr 4fr;gap:25px;box-shadow:0 8px 26px #7777}.story .hero{width:100%;margin:0}.story h1{font:38px/1 Georgia;margin:10px 0 18px}.story p{font:16px/1.65 Georgia}.map{position:relative;min-height:calc(100vh - 116px);padding:50px 8%;background:radial-gradient(#c9c5bb 1px,transparent 1px);background-size:18px 18px}.root{margin:auto;background:#242622;color:#f8f3e8;width:max-content;max-width:90%;padding:20px 28px;text-align:center;font:bold 25px Georgia}.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:28px;max-width:980px;margin:48px auto 0}.branch{background:var(--paper);border-top:3px solid var(--red);padding:14px}.branch b{font:18px Georgia}.leaf{font-size:14px;border-top:1px solid #d2cabd;padding:8px 0}.relation .root{border-radius:50%;width:165px;height:165px;display:grid;place-items:center}.relation .branch{border:2px solid var(--red)}.split .branches{grid-template-columns:repeat(2,minmax(170px,1fr))}@media(max-width:760px){.nav{padding:0 13px;gap:10px}.brand{display:none}.tabs button{padding:0 9px;font-size:13px}.tool{grid-template-columns:1fr}.panel{padding:18px}.work{overflow:visible}.bar{padding:0 15px}.paper{width:calc(100% - 24px);margin:14px auto;padding:20px}.mast b{font-size:20px}.mast{font-size:8px}.paper h1{font-size:41px}.cols{columns:1}.story{grid-template-columns:1fr;padding:20px;margin:18px auto}.story .hero{max-width:300px;margin:auto}.map{padding:35px 20px}.split .branches{grid-template-columns:1fr}.bar button{font-size:12px;padding:8px}.label textarea{height:130px}}@media print{.nav,.panel,.bar{display:none}.tool{display:block}.paper,.story{box-shadow:none;width:100%;margin:0}.map{min-height:auto}}
  </style>
</head>
<body><nav class="nav"><span class="mark">N</span><span class="brand">Newsroom Studio</span><div class="tabs"><button data-tab="news" class="on">新闻排版</button><button data-tab="write">写文章</button><button data-tab="map">思维导图</button></div></nav><main id="app"></main>
<script>
const state={tab:'news',name:'THE FINANCIAL JOURNAL',edition:'晨间版',title:'市场在不确定性中寻找新的定价锚点',article:'市场在不确定性中寻找新的定价锚点\n\n投资者正在重新评估增长、通胀与利率之间的微妙平衡。过去数周，风险资产的波动并未削弱企业扩张的意愿，反而让管理层更强调现金流与执行效率。\n\n在上海、纽约与伦敦，交易员把目光投向即将公布的宏观数据。对长期投资者而言，真正重要的并不是某一个数字，而是数据背后趋势是否会改变。\n\n“当预期变得拥挤，耐心本身就是一种优势。”一位资深基金经理表示。',cols:3,image:'',writerTitle:'一篇值得被好好阅读的文章',writerText:'把文章粘贴到左侧，便会自动排成一张干净的竖版文章卡。',writerImage:'',markdown:'# 品牌增长计划\n## 内容策略\n- 深度报道\n- 每周通讯\n## 产品体验\n- 编辑器优化\n- 移动端使用',style:'normal'};
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const file=(key)=>`<input id="${key}File" type="file" accept="image/*" hidden><div class="hero" id="${key}Pick">${state[key]?`<img src="${state[key]}">`:'<div><b>点击上传 3:4 主图</b><br><small>图片只保存在当前设备</small></div>'}</div>`;
function panel(content){return `<aside class="panel">${content}</aside>`}function bar(title){return `<header class="bar"><span>${title}</span><button onclick="window.print()">保存为 PDF</button></header>`}
function news(){let ps=state.article.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');return `<div class="tool">${panel(`<b>新闻编辑台</b><label class="label">报纸名称<input data-k="name" value="${esc(state.name)}"></label><label class="label">版次<select data-k="edition"><option ${state.edition==='晨间版'?'selected':''}>晨间版</option><option ${state.edition==='午间版'?'selected':''}>午间版</option><option ${state.edition==='周末版'?'selected':''}>周末版</select></label><label class="label">主标题<input data-k="title" value="${esc(state.title)}"></label><label class="label">文章内容<textarea data-k="article">${esc(state.article)}</textarea></label><div class="label">栏数<div class="buttons">${[2,3,4].map(n=>`<button data-cols="${n}" class="${state.cols===n?'on':''}">${n}栏</button>`).join('')}</div></div><p class="note">所有文字可在左侧编辑；图片不会上传。</p>`)}<section class="work">${bar('新闻排版预览')}<article class="paper"><span class="water">无墙之门</span><div class="mast"><span>EST. 2026</span><b>${esc(state.name)}</b><span>${esc(state.edition)} · 亚洲</span></div><div class="rule"></div><div class="kicker">商业与市场 / 深度报道</div><h1>${esc(state.title)}</h1><p class="deck">用清晰、克制的报纸版式，让每一段重要叙述都有呼吸的空间。</p><div class="by">记者：编辑部　2026 年 8 月 11 日　阅读 4 分钟</div>${file('image')}<div class="cols" style="columns:${state.cols} 200px">${ps}</div></article></section></div>`}
function write(){return `<div class="tool">${panel(`<b>写文章</b><label class="label">标题<input data-k="writerTitle" value="${esc(state.writerTitle)}"></label><label class="label">文章<textarea data-k="writerText">${esc(state.writerText)}</textarea></label><p class="note">粘贴文字后生成 3:4 文章卡。</p>`)}<section class="work">${bar('3:4 文章版')}<article class="story"><span class="water">无墙之门</span>${file('writerImage')}<div><small style="color:#b54a37;letter-spacing:1px">STORY / NOTES</small><h1>${esc(state.writerTitle)}</h1>${state.writerText.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div></article></section></div>`}
function mapData(){let root='思维导图',a=[];let current;state.markdown.split('\n').forEach(x=>{x=x.trim();if(/^#\s/.test(x))root=x.slice(2);else if(/^##\s/.test(x)){current={t:x.slice(3),i:[]};a.push(current)}else if(/^-\s/.test(x)){if(!current){current={t:'要点',i:[]};a.push(current)}current.i.push(x.slice(2))}});return{root,a:a.length?a:[{t:'开始',i:['输入 Markdown']}]} }
function map(){let m=mapData();return `<div class="tool">${panel(`<b>Markdown 思维导图</b><label class="label">Markdown<textarea data-k="markdown">${esc(state.markdown)}</textarea></label><div class="label">布局方式<div class="buttons">${[['normal','分支'],['relation','人物关系'],['split','左右']].map(([k,n])=>`<button data-style="${k}" class="${state.style===k?'on':''}">${n}</button>`).join('')}</div></div><p class="note">输入后即时更新。# 为中心主题，## 为分支，- 为节点。</p>`)}<section class="work">${bar('思维导图')}<div class="map ${state.style}"><span class="water">无墙之门</span><div class="root">${esc(m.root)}</div><div class="branches">${m.a.map(b=>`<div class="branch"><b>${esc(b.t)}</b>${b.i.map(i=>`<div class="leaf">${esc(i)}</div>`).join('')}</div>`).join('')}</div></div></section></div>`}
function bind(){document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{state[e.dataset.k]=e.value;render()});document.querySelectorAll('[data-cols]').forEach(e=>e.onclick=()=>{state.cols=+e.dataset.cols;render()});document.querySelectorAll('[data-style]').forEach(e=>e.onclick=()=>{state.style=e.dataset.style;render()});['image','writerImage'].forEach(k=>{let p=document.getElementById(k+'Pick'),f=document.getElementById(k+'File');if(p){p.onclick=()=>f.click();f.onchange=()=>{let r=new FileReader();r.onload=()=>{state[k]=r.result;render()};if(f.files[0])r.readAsDataURL(f.files[0])}}})}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));app.innerHTML=state.tab==='news'?news():state.tab==='write'?write():map();bind()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();
</script></body></html>
